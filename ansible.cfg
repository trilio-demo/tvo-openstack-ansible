[defaults]
# No `inventory =` directive: every playbook in this repo uses
# `hosts: localhost` + `connection: local` to drive the OpenStack APIs.
# Re-add if/when a play needs to SSH into managed VMs (e.g. automating
# os-mount-datavol.sh). Today, that's done manually per CLAUDE.md.
#
# Silence informational warnings emitted when running with no inventory.
# These apply to every play in this repo (which is by-design localhost-
# only). A *malformed* inventory file would still trigger a different
# "Unable to parse" warning that these flags do not affect.
localhost_warning    = False
host_key_checking    = False
# yaml callback lives in community.general; install via:
#   ansible-galaxy collection install community.general
# then change the value to: community.general.yaml
# stdout_callback      = community.general.yaml
interpreter_python   = auto_silent
deprecation_warnings = False

[inventory]
# Companion to the localhost-only design above: silence the
# "No inventory was parsed" warning. This setting lives in [inventory],
# not [defaults] — Ansible reads it from the [inventory] section per
# its config base.yml.
inventory_unparsed_warning = False
